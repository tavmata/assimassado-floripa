<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="warmAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="warmTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <style>
      @keyframes steamPlumeRise1 {
        0% {
          transform: translateY(0px) scaleY(0.9) skewX(0deg);
          opacity: 0.35;
        }
        50% {
          transform: translateY(-5px) scaleY(1.18) skewX(5deg);
          opacity: 1;
        }
        100% {
          transform: translateY(-10px) scaleY(1.3) skewX(-4deg);
          opacity: 0.2;
        }
      }

      @keyframes steamPlumeRise2 {
        0% {
          transform: translateY(0px) scaleY(0.95) skewX(0deg);
          opacity: 0.3;
        }
        50% {
          transform: translateY(-7px) scaleY(1.22) skewX(-5deg);
          opacity: 1;
        }
        100% {
          transform: translateY(-12px) scaleY(1.38) skewX(4deg);
          opacity: 0.15;
        }
      }

      @keyframes steamPlumeRise3 {
        0% {
          transform: translateY(0px) scaleY(0.9) skewX(0deg);
          opacity: 0.4;
        }
        50% {
          transform: translateY(-6px) scaleY(1.15) skewX(4deg);
          opacity: 0.95;
        }
        100% {
          transform: translateY(-11px) scaleY(1.28) skewX(-5deg);
          opacity: 0.22;
        }
      }

      .logo-steam-1 {
        animation: steamPlumeRise1 2.4s ease-in-out infinite alternate;
        transform-origin: 23px 22px;
      }
      .logo-steam-2 {
        animation: steamPlumeRise2 3.1s ease-in-out infinite alternate 0.45s;
        transform-origin: 31px 22px;
      }
      .logo-steam-3 {
        animation: steamPlumeRise3 2.7s ease-in-out infinite alternate 0.9s;
        transform-origin: 39px 23px;
      }
    </style>
  </defs>

  <!-- Steaming Coffee Cup Icon -->
  <g transform="translate(10, 10)">
    <!-- Steam lines with dual SMIL + CSS Keyframe support -->
    <path class="logo-steam-1" d="M22 6 C20 12, 26 16, 23 22" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.95">
      <animate attributeName="d" values="M22 6 C20 12, 26 16, 23 22; M23 5 C25 11, 19 17, 22 23; M22 6 C20 12, 26 16, 23 22" dur="3s" repeatCount="indefinite"/>
    </path>
    <path class="logo-steam-2" d="M30 4 C28 11, 34 15, 31 22" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" opacity="0.95">
      <animate attributeName="d" values="M30 4 C28 11, 34 15, 31 22; M31 3 C33 10, 27 16, 30 23; M30 4 C28 11, 34 15, 31 22" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <path class="logo-steam-3" d="M38 7 C36 13, 42 17, 39 23" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.95">
      <animate attributeName="d" values="M38 7 C36 13, 42 17, 39 23; M39 6 C41 12, 35 18, 38 24; M38 7 C36 13, 42 17, 39 23" dur="2.8s" repeatCount="indefinite"/>
    </path>

    <!-- Cup Body -->
    <path d="M12 24 L48 24 C48 42, 42 50, 30 50 C18 50, 12 42, 12 24 Z" fill="#1c1917" stroke="url(#warmAmber)" stroke-width="2"/>
    
    <!-- Cup Handle -->
    <path d="M47 28 C56 28, 56 42, 46 44" fill="none" stroke="url(#warmAmber)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Saucer -->
    <path d="M8 53 C18 57, 42 57, 52 53" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(80, 14)">
    <!-- "Assim" -->
    <text x="0" y="28" font-family="'Fraunces', Georgia, serif" font-size="28" font-weight="900" fill="#1c1917" letter-spacing="-0.5">
      Assim
    </text>
    
    <!-- "Assado" in Terracotta/Amber -->
    <text x="84" y="28" font-family="'Fraunces', Georgia, serif" font-size="28" font-weight="900" fill="url(#warmTerracotta)" letter-spacing="-0.5">
      Assado
    </text>

    <!-- Subtitle / Tagline -->
    <text x="1" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#78716c" letter-spacing="1.5">
      PADARIA • CAFÉ • LANCHES
    </text>
    <text x="160" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="800" fill="#d97706" letter-spacing="0.5">
      TRINDADE (UFSC)
    </text>
  </g>
</svg>
